plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

def signingPropertiesFile = rootProject.file("signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "com.maternaltracker.india"
    compileSdk 35

    defaultConfig {
        applicationId "com.maternaltracker.india"
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName "1.1.23"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    lint {
        disable "GradleDependency"
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation platform("com.google.firebase:firebase-bom:33.10.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    testImplementation "junit:junit:4.13.2"
}
